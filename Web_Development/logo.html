<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
      }
      .container {
        height: 380px;
        width: 380px;
        margin: auto;
        border: 2px solid black;
        padding-bottom: 0;
        padding-top: 7px;
        border-radius: 50%;
        background-color: azure;
        background-image: url(https://as2.ftcdn.net/v2/jpg/05/48/96/87/1000_F_548968793_kPtlbUZL4ku0lCqIAUQAUK6WdOaGVSMT.jpg);
        background-size: 100% 100%;
        background-repeat: no-repeat;
        align-content: center;
        position: relative;
        top: 10px;
      }
       h1{
        text-align: center;
        /* font-size: 65px; */
        font-family: "Cinzel Decorative";
        /* background: linear-gradient(145deg, #dd7907, #ffffff, green);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent; */
        /* position: relative;
        bottom: 30px; */
        margin: 0;
      }

       .h1{
        display: flex;
        justify-content: center;
        flex-direction: row;
        gap: 0px;
        width: 250px;
        margin: auto;
        background: linear-gradient(145deg, #dd7907, #ffffff, green);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
        bottom: 13px;
        /*border: 2px solid red;*/
      }
      p {
        font-size: 28px;
        text-align: center;
        width: 250px;
        margin: auto;
        margin-top: 50px;
        font-family: "Great vibes";
      }

      .title {
        color: #1ed4de;
        position: relative;
        bottom: 20px;
        font-size: 29px;
        font-weight: bold;
      }

      .owner {
        position: relative;
        bottom: 10px;
        font-size: 22px;
        color: rgb(238, 240, 235);
        background: linear-gradient(145deg, #ce0808, #e35f5f, #f1cccc, #dfc3c3, #ef5b5b, rgb(203, 5, 5));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
      }

      .a {
        font-size: 65px;
      }

      .s {
        font-size: 61px;
      }

      #ar {
  font-size: 47px;
  position: relative;
  top: 4px;
  background: inherit; 
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  padding-right: 12px;
  text-align: center;
  margin-right: 0px;
  margin-left: 5px;
} 

      .r{
        font-size: 53px;
        margin-right: 5px;
      }

      .e {
        font-size: 72px;
        margin-left: 12px;
        position: relative;
        bottom: 3px;
         background: inherit; 
        -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
      }
    </style>
    <title>rabbanisamdani</title>
  </head>
  <body>
    <div class="container">
      <p class="title" title="The title">Enter the Quantum Realm of Legends</p>
      <div class="h1" title="Company name">
        <h1 class="a">A</h1>
        <h1 class="s">S</h1>
        <h1 id="ar">A</h1>
        <h1 class="r">R</h1>
        <h1 class="e">E</h1>
      </div>
      <p title="Owner's name" class="owner">Owner: G.Rabbani</p>
    </div>
  </body>
</html>
