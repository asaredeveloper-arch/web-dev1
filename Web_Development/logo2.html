<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
      }
      .container {
        height: 380px;
        width: 380px;
        margin: auto;
        border: 2px solid black;
        padding-bottom: 0;
        padding-top: 7px;
        border-radius: 50%;
        background-color: azure;
        background-image: url(https://as2.ftcdn.net/v2/jpg/05/48/96/87/1000_F_548968793_kPtlbUZL4ku0lCqIAUQAUK6WdOaGVSMT.jpg);
        background-size: 100% 100%;
        background-repeat: no-repeat;
        align-content: center;
        position: relative;
        top: 10px;
      }
      h1 {
        text-align: center;
        display: flex;
        justify-content: center;
        font-size: 60px;
        font-family: "Cinzel Decorative";
        background: linear-gradient(145deg, #dd7907, #ffffff, green);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
        bottom: 22px;
        margin: auto;
      }

      .h1 {
        border: 2px solid white;
      }
      p {
        font-size: 29px;
        text-align: center;
        width: 250px;
        margin: auto;
        color: whitesmoke;
        margin-top: 50px;
        font-family: "Great vibes";
      }

      .title {
        color: rgb(241, 245, 245);
        position: relative;
        bottom: 30px;
        letter-spacing: 3px;
        background-color: #0000fe26;
        padding: 5px;
        border-radius: 100px;
        /* background: linear-gradient(150deg, white, lightblue, skyblue, #009dff, black);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent; */
        font-weight: 900;
      }

      .owner {
        position: relative;
        bottom: 20px;
        font-size: 30px;
        color: rgb(238, 240, 235);
        font-weight: 900;
        background-color: #0000fe26;
        padding: 5px;
        border-radius: 100px;
      }
    </style>
    <title>rabbanisamdani</title>
  </head>
  <body>
    <div class="container">
      <p class="title">Enter the Quantum Realm of Legends</p>
      <h1>ASARE</h1>
      <p title="About owner" class="owner">Owner: G.Rabbani</p>
    </div>
  </body>
</html>
